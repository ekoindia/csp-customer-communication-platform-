name: Build CSP Scan APK

# Builds the CSP Scan Android app (a WebView shell around
# csp_dashboard/mobile_scanner/scan.html) and publishes a downloadable,
# debug-signed .apk as a workflow artifact. No Android Studio needed locally.

on:
  push:
    paths:
      - 'mobile_app/**'
      - 'csp_dashboard/mobile_scanner/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write   # needed to publish the APK to a Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Bundle scanner + vendored libraries into app assets
        run: |
          set -e
          A=mobile_app/app/src/main/assets
          S=csp_dashboard/mobile_scanner
          mkdir -p "$A"
          # Straight copy — NO url rewriting and NO downloads at build time.
          # scan.html already loads every library from its own origin (lib/...),
          # both in the APK and in a browser. Nothing here may reintroduce a CDN:
          # this page handles customer PII, so a third-party script on it could
          # read the scan (DPDP remediation 2026-07-31 — see
          # documentation/APK_MOBILE_SCANNER_SPEC.md).
          cp "$S/scan.html"     "$A/scan.html"
          cp "$S/manifest.json" "$A/manifest.json"
          cp "$S/icon.svg"      "$A/icon.svg"
          cp -r "$S/lib"        "$A/lib"
          # Integrity of the vendored libraries (checked in, not fetched).
          (cd "$A/lib" && sha256sum -c SHA256SUMS)
          # Fail the build if any external origin creeps back into the page.
          if grep -nE 'https?://(cdn\.jsdelivr\.net|tessdata\.projectnaptha\.com|unpkg\.com)' "$A/scan.html"; then
            echo "ERROR: scan.html references an external CDN — not allowed on a page that handles customer data."
            exit 1
          fi
          echo "== bundled libs =="; ls -lh "$A/lib"

      - name: Download Gradle 8.5
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip
          unzip -q gradle-8.5-bin.zip

      - name: Build release APK (non-debuggable, debug-signed for sideload)
        working-directory: mobile_app
        run: ../gradle-8.5/bin/gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: |
          cp mobile_app/app/build/outputs/apk/release/app-release.apk CSP-Scan.apk
          ls -lh CSP-Scan.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CSP-Scan-APK
          path: CSP-Scan.apk
          if-no-files-found: error

      - name: Publish APK to a Release (direct .apk download, no zip)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: CSP Scan — latest APK
          body: |
            Latest **CSP Scan** Android app (fully offline, no internet permission).
            Download **CSP-Scan.apk** below and send it to the CSP over WhatsApp.
          files: CSP-Scan.apk
          fail_on_unmatched_files: true
          make_latest: true
